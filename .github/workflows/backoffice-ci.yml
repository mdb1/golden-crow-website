# Backoffice CI — quality gate for the GC Fitness trainer backoffice.
#
# WHY (260529): the backoffice auto-deploys to Vercel on push to `main` with
# NOTHING in front of it — a broken import, type error, or failing test ships
# straight to production (this is how the dashboard + recent-logs outage
# reached users). This workflow runs the gates that would have caught it.
#
# ⚠️ IMPORTANT — make Vercel respect this check. A green/red result here does
# NOT, by itself, stop Vercel's Git deploy. To actually BLOCK bad deploys, do
# ONE of:
#   (a) Vercel → Project → Settings → Git → enable "Only deploy when checks
#       pass" / require this status check, OR
#   (b) set a Vercel "Ignored Build Step" that exits non-zero when CI fails, OR
#   (c) turn off Vercel Git auto-deploy and deploy from this workflow after the
#       gates pass.
# Also enforce as a required status check in GitHub branch protection for `main`.

name: Backoffice CI

on:
  pull_request:
    paths:
      - "backoffice/**"
      - ".github/workflows/backoffice-ci.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "backoffice/**"
      - ".github/workflows/backoffice-ci.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: backoffice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OPTIONAL — full Firestore index-coverage enforcement needs
      # firestore.indexes.json, which lives in the SIBLING gc-fitness repo.
      # Uncomment and set the repo slug (+ a PAT secret if it is private), then
      # uncomment FIRESTORE_INDEXES_PATH in the index-coverage step below.
      # Without this, the index check WARN-skips in CI (it still enforces
      # locally, where the sibling repo is checked out next to this one).
      # - name: Checkout gc-fitness (index definitions)
      #   uses: actions/checkout@v4
      #   with:
      #     repository: <owner>/gc-fitness
      #     token: ${{ secrets.GC_FITNESS_REPO_TOKEN }}
      #     path: _gc-fitness

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches broken imports + type errors with no runtime env needed — this
      # is the primary guard against "page 500s because a module failed to load".
      - name: Typecheck
        working-directory: backoffice
        run: pnpm typecheck

      - name: Unit tests
        working-directory: backoffice
        run: pnpm test -- --ci

      # Fails if a query needs a composite index that isn't declared. See
      # scripts/check-firestore-indexes.mjs for scope + limitations.
      - name: Firestore composite-index coverage
        working-directory: backoffice
        # env:
        #   FIRESTORE_INDEXES_PATH: ${{ github.workspace }}/_gc-fitness/firestore.indexes.json
        run: pnpm check:firestore-indexes

      # Full production build — catches build-time regressions (RSC boundaries,
      # next/font, route config) that tsc alone misses.
      # NOTE: if `next build` needs NEXT_PUBLIC_* Firebase config, add those as
      # repo secrets and surface them here via `env:`.
      - name: Build
        working-directory: backoffice
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
