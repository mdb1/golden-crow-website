<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/botfarm/">
  <title>Golden Crow Botfarm Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">GC</div>
        <div>
          <h1>Golden Crow</h1>
          <p>Botfarm operations</p>
        </div>
      </div>

      <div class="search-block">
        <label class="search-label" for="globalSearch">Search</label>
        <input id="globalSearch" class="search" type="search" placeholder="employee, ticket, metric">
      </div>

      <nav class="nav" aria-label="Dashboard sections">
        <button data-view="overview" class="active"><span>Overview</span><small>Pulse and priorities</small></button>
        <button data-view="results"><span>Core Results</span><small>Mateo, Mia, Sam</small></button>
        <button data-view="employees"><span>Employees</span><small>Profiles and state</small></button>
        <button data-view="incidents"><span>Incidents</span><small>Failures and impact</small></button>
        <button data-view="stakeholders"><span>Stakeholder Hub</span><small>Requests and replies</small></button>
        <button data-view="database"><span>Company Database</span><small>Tables and exports</small></button>
        <button data-view="ads"><span>Ads Cycle</span><small>Olivia, Nora, Sam</small></button>
        <button data-view="events"><span>Events</span><small>File activity</small></button>
        <button data-view="listener"><span>Live Listener</span><small>Observed changes</small></button>
        <button data-view="emails"><span>Emma Emails</span><small>Morning reports</small></button>
        <button data-view="tickets"><span>Tickets</span><small>Open work</small></button>
        <button data-view="operations"><span>Operations</span><small>Cron and raw data</small></button>
      </nav>

      <div class="sidebar-foot">
        <span id="generatedAt">Loading</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Backoffice secondary flow</p>
          <h2 id="pageTitle">Overview</h2>
        </div>
        <div class="actions">
          <span id="requestSignal" class="request-signal">Requests: 0</span>
          <button id="reloadData" type="button">Reload data</button>
          <button id="downloadJson" type="button">Download JSON</button>
        </div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
